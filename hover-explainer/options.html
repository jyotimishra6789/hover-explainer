<!doctype html>
<meta charset="utf-8">
<title>Hover Explainer options</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; color: #1b2333; }
  input { width: 100%; padding: 8px; font: 14px ui-monospace, monospace; margin: 8px 0; box-sizing: border-box; }
  button { padding: 8px 14px; background: #2f5bea; color: #fff; border: 0; border-radius: 6px; font-size: 14px; cursor: pointer; }
  small { color: #55627d; display: block; margin-top: 12px; }
</style>
<h1>Hover Explainer</h1>
<label for="key">Anthropic API key (only needed for "Explain with AI")</label>
<input id="key" type="password" placeholder="sk-ant-..." autocomplete="off">
<button id="save">Save</button> <span id="status"></span>
<small>The key is stored in this browser profile only (chrome.storage.local) and is sent only to api.anthropic.com. Anyone with access to your browser profile could read it, so use a key with a spend limit.</small>
<script src="options.js"></script>
